name: Build and deploy containers

on:
  push:
    branches:
      - main

concurrency:
  group: content-factory-release-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish container images
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/docker/api/Dockerfile
          push: true
          tags: |
            ghcr.io/silverberdi/content-factory-api:${{ github.sha }}
            ghcr.io/silverberdi/content-factory-api:latest

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/docker/web/Dockerfile
          push: true
          tags: |
            ghcr.io/silverberdi/content-factory-web:${{ github.sha }}
            ghcr.io/silverberdi/content-factory-web:latest

  deploy:
    name: Deploy immutable containers
    needs: build
    runs-on: [self-hosted, linux, x64, factory-deploy]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy the immutable images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | sudo /usr/local/sbin/deploy-container-app content-factory "$IMAGE_TAG"
