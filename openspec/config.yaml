schema: spec-driven

context: |
  Product: Content Factory.

  Purpose:
  Private multi-editorial-line AI audiovisual content factory for research,
  generation, assembly, review, scheduling, publication, operational control,
  and basic analytics.

  Canonical delivery hierarchy:
  Roadmap -> Wave -> Slice -> User Stories -> OpenSpec tasks.

  Delivery model:
  - The roadmap is sequential and contract-driven.
  - A wave delivers a complete major objective and cannot close partially.
  - A slice is the complete implementation and integration unit.
  - Cursor or Codex owns one complete slice.
  - The other operator performs mandatory cross-review.
  - One slice normally maps to one OpenSpec change.
  - User Stories remain the functional backlog units.
  - Tasks are derived and maintained inside OpenSpec.
  - No work from a future wave may be implemented early.
  - Difficulty is not a reason to abandon or reassign a slice.

  Closure requirements:
  - Acceptance criteria satisfied.
  - Automated checks PASS.
  - OpenSpec Verify result exactly PASS.
  - Cross-review verdict READY_TO_MERGE.
  - Canonical documentation synchronized.
  - Current context pack regenerated and validated.
  - OpenSpec change synchronized and archived.
  - No unresolved blockers or hidden deferred work.
  - When human validation applies, the slice must be deployed, smoke-tested,
    tested by Silverio, and receive explicit GO before closure.

  Deviation policy:
  When an unplanned requirement, dependency, or blocker is discovered, stop the
  affected execution and synchronize the User Story, backlog, roadmap, affected
  wave contracts, and OpenSpec artifacts before continuing. Do not hide missing
  work as notes or informal technical debt.

  Branching and integration:
  - main represents the last fully completed wave.
  - wave/* branches integrate all slices of one wave.
  - slice/* branches are created from the active wave branch.
  - Slice pull requests target wave/* and may auto-merge after all gates pass.
  - Wave pull requests target main and require Silverio's manual merge.
  - Never push directly to protected wave branches or main.

  Architecture:
  - Nx monorepo.
  - Angular 22 responsive PWA console.
  - PrimeNG and PrimeIcons are the official UI libraries.
  - Spanish-first and translation-ready user interface.
  - Light, dark, and system appearance modes from W00.
  - NestJS API using Fastify.
  - Prisma with dedicated PostgreSQL database content_factory.
  - Dedicated MinIO bucket and credentials.
  - n8n orchestration with PostgreSQL as canonical job and scheduling state.
  - Containerized Node/TypeScript FFmpeg media worker.
  - Docker-based runtime with no required host application installations.
  - Public entry point studio.silverman.pro through Cloudflare Tunnel.

  Security and operations:
  - Google OIDC with a closed user allowlist.
  - Secure HttpOnly cookie sessions; no authentication tokens in localStorage.
  - Authorization enforced in both UI and API.
  - No secrets, tokens, cookies, or sensitive bodies in Git or logs.
  - Deployments must be idempotent and non-destructive.
  - Never delete persistent volumes or reset a shared database.
  - Use prisma migrate deploy only after required safety checks.

  Canonical sources:
  - docs/context/project-context.md
  - docs/context/current-state.md
  - docs/context/openspec-context-index.md
  - docs/requirements/product-requirements.md
  - docs/architecture/architecture.md
  - docs/methodology/delivery-methodology.md
  - docs/methodology/deviation-policy.md
  - docs/roadmap/roadmap.md
  - docs/backlog/backlog.md
  - docs/waves/
  - docs/backlog/user-stories/
  - docs/decisions/decision-register.md
  - AGENTS.md
  - .cursor/rules/

  Before proposing, applying, reviewing, verifying, synchronizing, or archiving
  a change, inspect the active wave contract, assigned slice, included User
  Stories, current context, and applicable agent rules.

rules:
  proposal:
    - Reference the wave ID, slice ID, and every included User Story ID.
    - State the business objective and value delivered by the complete slice.
    - State prerequisites, dependencies, scope, explicit exclusions, risks, and blockers.
    - Identify the primary implementer and mandatory cross-reviewer.
    - State whether deployment and Silverio human validation are required.
    - Refuse to propose future-wave scope or work whose prerequisites are not satisfied.
    - Define rollback or safe recovery considerations when runtime behavior, data, or deployment is affected.

  specs:
    - Use normative SHALL requirements with explicit testable scenarios.
    - Cover success, validation, authorization, and failure behavior where applicable.
    - Cover idempotency, retries, partial success, recovery, and concurrency where applicable.
    - Identify persistence, provider, workflow, asset, budget, notification, and publication effects where applicable.
    - Preserve all product, database, storage, credentials, workflow, route, and deployment isolation boundaries.
    - Make human acceptance criteria explicit when automated verification is insufficient.

  design:
    - Explain capability and module boundaries and enforce valid Nx dependencies.
    - Describe affected Angular, PrimeNG, NestJS, Prisma, PostgreSQL, MinIO, n8n, provider, worker, and Docker components.
    - Include security, authorization, session, secret-handling, and logging implications.
    - Include data model, migration, idempotency, retry, observability, and recovery implications.
    - Define testing strategy and required evidence.
    - Define safe deployment, smoke-test, and rollback behavior when applicable.
    - Do not introduce infrastructure, abstractions, or future capabilities outside the active slice.

  tasks:
    - Organize tasks in dependency-safe execution order.
    - Include implementation, unit tests, integration tests, contract tests, and UI validation as applicable.
    - Include synchronization of roadmap, backlog, User Stories, wave contracts, and decisions when affected.
    - Include current context-pack regeneration and validation.
    - Include OpenSpec verification with required result PASS.
    - Include mandatory Cursor-Codex cross-review and resolution of findings.
    - Include deployment, health checks, smoke tests, Silverio test instructions, and GO when human validation applies.
    - Include spec synchronization and change archival only after the complete slice contract is satisfied.
    - Do not mark tasks complete while blockers, hidden deferred scope, or unresolved acceptance criteria remain.
